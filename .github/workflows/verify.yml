name: Verify PhishExplain Shield and research portal

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node runtime
        run: node --version && npm --version
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Syntax, generated pages and vendored libraries are current
        run: |
          npm run check
          node --check scripts/evaluate.mjs
      - name: Unit, security and research tests
        run: npm test
      - name: Browser integration tests (installed Google Chrome)
        run: PLAYWRIGHT_CHANNEL=chrome npm run test:e2e
      - name: Validate research corpus invariants
        run: |
          for route in lab dataset annotation evaluation errors research methods course presentation nlp; do test -s "$route/index.html"; done
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("data/candidate_emails.json","utf8")); if(x.examples.length!==60||x.examples.some(e=>e.review_status!=="UNREVIEWED"))process.exit(1);'
